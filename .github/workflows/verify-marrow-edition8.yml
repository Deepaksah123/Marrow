name: Verify Marrow Edition 8

on:
  push:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source and materialized Edition 8
        shell: bash
        run: |
          set -euo pipefail
          TMP="${RUNNER_TEMP}/webrepo"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/sunday2212/WEBREPLITX5.git "$TMP"
          cd "$TMP"
          git sparse-checkout set --no-cone "frontend/quizx/Brain/Marrow/Edition 8 qBank/**"
          cd "$GITHUB_WORKSPACE"
          SRC="$TMP/frontend/quizx/Brain/Marrow/Edition 8 qBank"
          DST="app/src/main/assets/marrow_content/Brain/Marrow/Edition 8 qBank"
          python3 - <<'PY'
          import json, pathlib, hashlib
          src=pathlib.Path("frontend/quizx/Brain/Marrow/Edition 8 qBank")
          dst=pathlib.Path("app/src/main/assets/marrow_content/Brain/Marrow/Edition 8 qBank")
          def scan(root):
              files={}; questions=0; image_tags=0; image_fields=0; ids=0; subjects={}
              for p in root.rglob("*.json"):
                  rel=p.relative_to(root).as_posix()
                  data=json.loads(p.read_text(encoding="utf-8")); qs=data.get("questions",[])
                  questions += len(qs); ids += sum(1 for q in qs if q.get("question_id"))
                  image_tags += sum(q.get("solution","").count("<img") for q in qs)
                  image_fields += sum(len(q.get("question_images") or []) + len(q.get("explanation_images") or []) for q in qs)
                  subject=rel.split("/",1)[0]
                  subjects.setdefault(subject,{"files":0,"questions":0}); subjects[subject]["files"]+=1; subjects[subject]["questions"]+=len(qs)
                  files[rel]=hashlib.sha256(p.read_bytes()).hexdigest()
              return files,questions,image_tags,image_fields,ids,subjects
          sf,sq,si,sif,sids,ss=scan(src); df,dq,di,dif,dids,ds=scan(dst)
          missing=sorted(set(sf)-set(df)); extra=sorted(set(df)-set(sf)); changed=sorted(k for k in sf if k in df and sf[k]!=df[k])
          print("SOURCE_FILES",len(sf)); print("TARGET_FILES",len(df)); print("SOURCE_QUESTIONS",sq); print("TARGET_QUESTIONS",dq)
          print("SOURCE_IDS",sids); print("TARGET_IDS",dids); print("SOURCE_SOLUTION_IMG_TAGS",si); print("TARGET_SOLUTION_IMG_TAGS",di)
          print("SOURCE_IMAGE_FIELDS",sif); print("TARGET_IMAGE_FIELDS",dif); print("MISSING_FILES",len(missing)); print("EXTRA_FILES",len(extra)); print("CHANGED_FILES",len(changed))
          print("SUBJECT_BREAKDOWN")
          for s in sorted(ss): print(s, "SOURCE_FILES",ss[s]["files"],"SOURCE_Q",ss[s]["questions"],"TARGET_FILES",ds.get(s,{}).get("files",0),"TARGET_Q",ds.get(s,{}).get("questions",0))
          if missing: print("MISSING_LIST",missing[:50])
          if extra: print("EXTRA_LIST",extra[:50])
          if changed: print("CHANGED_LIST",changed[:50])
          assert len(sf)==len(df) and sq==dq and sids==dids and si==di and sif==dif and not missing and not extra and not changed
          print("VERDICT PASS")
          PY
