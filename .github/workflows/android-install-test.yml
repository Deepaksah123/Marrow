name: Android 12 and 13 Installation Verification

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "scripts/sync_marrow_source.sh"
      - ".github/workflows/android-install-test.yml"
  workflow_dispatch:

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        api-level: [31, 33]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Materialize exact Marrow content
        run: bash scripts/sync_marrow_source.sh
      - name: Build signed APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Direct Android emulator verification
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          AVDMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name avdmanager | head -1)"
          ADB="$ANDROID_HOME/platform-tools/adb"
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "emulator" "platforms;android-${{ matrix.api-level }}" "system-images;android-${{ matrix.api-level }};google_apis;x86_64" >/dev/null
          test -x "$ADB"
          test -x "$EMULATOR"

          echo no | "$AVDMANAGER" create avd --force -n marrow-test --package "system-images;android-${{ matrix.api-level }};google_apis;x86_64" --device "pixel_4"
          nohup "$EMULATOR" -avd marrow-test -port 5554 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none >/tmp/emulator.log 2>&1 &
          EMU_PID=$!
          trap 'kill "$EMU_PID" >/dev/null 2>&1 || true' EXIT
          "$ADB" start-server >/dev/null 2>&1 || true
          for i in $(seq 1 120); do
            STATE="$("$ADB" get-state 2>/dev/null || true)"
            BOOT="$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            echo "attempt=$i state=$STATE boot=$BOOT"
            if [ "$STATE" = "device" ] && [ "$BOOT" = "1" ]; then break; fi
            "$ADB" reconnect offline >/dev/null 2>&1 || true
            sleep 2
          done
          test "$("$ADB" get-state)" = "device"
          test "$("$ADB" shell getprop sys.boot_completed | tr -d '\r')" = "1"
          "$ADB" install -r -t app/build/outputs/apk/debug/app-debug.apk
          "$ADB" shell pm path com.deepaksah.marrow.rebuild
          "$ADB" shell am start -W -n com.deepaksah.marrow.rebuild/.MainActivity
          sleep 5
          "$ADB" shell pidof com.deepaksah.marrow.rebuild
      - name: Upload diagnostic APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marrow-install-test-api-${{ matrix.api-level }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
