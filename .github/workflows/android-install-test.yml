name: Android 12 and 13 Installation Verification v2

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "scripts/sync_marrow_source.sh"
      - ".github/workflows/android-install-test.yml"
  workflow_dispatch:

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        api-level: [34]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Materialize exact Marrow content
        run: bash scripts/sync_marrow_source.sh
      - name: Build signed APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 3072M
          heap-size: 512M
          disk-size: 6000M
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          disable-animations: true
          emulator-boot-timeout: 900
          disable-linux-hw-accel: false
          pre-emulator-launch-script: |
            echo "=== KVM ==="
            ls -l /dev/kvm || true
            echo "=== CPU ==="
            nproc || true
            echo "=== DISK ==="
            df -h || true
            echo "=== EMULATOR ACCEL ==="
            "$ANDROID_HOME/emulator/emulator" -accel-check || true
          script: bash scripts/android_ui_smoke.sh ${{ matrix.api-level }}
      - name: Upload emulator screenshot and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marrow-install-test-api-${{ matrix.api-level }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            marrow-launch-api-${{ matrix.api-level }}-t05s.png
            marrow-launch-api-${{ matrix.api-level }}-t30s.png
            marrow-launch-api-${{ matrix.api-level }}-t60s.png
            marrow-ui-api-${{ matrix.api-level }}-qbank.png
            marrow-ui-api-${{ matrix.api-level }}-tests.png
            marrow-ui-api-${{ matrix.api-level }}-profile.png
            marrow-ui-api-${{ matrix.api-level }}-home-final.png
            launch.txt
            pid.txt
            activity.txt
            logcat.txt
            package.txt
            install-summary.txt
          if-no-files-found: ignore
