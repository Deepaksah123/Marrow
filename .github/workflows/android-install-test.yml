name: Android 12 and 13 Installation Verification

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "scripts/sync_marrow_source.sh"
      - ".github/workflows/android-install-test.yml"
  workflow_dispatch:

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        api-level: [31, 33]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Materialize exact Marrow content
        run: bash scripts/sync_marrow_source.sh
      - name: Build signed APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_4
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -wipe-data
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set -u
            adb wait-for-device
            for i in $(seq 1 60); do
              BOOT="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              echo "boot=$BOOT attempt=$i"
              [ "$BOOT" = "1" ] && break
              sleep 2
            done
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
            adb install -r -t app/build/outputs/apk/debug/app-debug.apk
            adb shell pm path com.deepaksah.marrow.rebuild
            set +e
            adb shell am start -W -n com.deepaksah.marrow.rebuild/.MainActivity 2>&1 | tee launch.txt
            START_RC=$?
            sleep 5
            adb shell pidof com.deepaksah.marrow.rebuild 2>&1 | tee pid.txt
            PID_RC=$?
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|mFocusedApp' | tee activity.txt
            adb logcat -d -v threadtime -t 1200 > logcat.txt
            adb shell dumpsys package com.deepaksah.marrow.rebuild > package.txt
            adb exec-out screencap -p > marrow-launch-api-${{ matrix.api-level }}.png
            {
              echo "start_rc=$START_RC"
              echo "pid_rc=$PID_RC"
              echo "--- launch ---"
              cat launch.txt
              echo "--- pid ---"
              cat pid.txt
              echo "--- activity ---"
              cat activity.txt
              echo "--- crash markers ---"
              grep -E 'FATAL EXCEPTION|AndroidRuntime|Process: com.deepaksah.marrow.rebuild|ANR in' logcat.txt | tail -80 || true
            } | tee install-summary.txt
            test "$START_RC" -eq 0
            test "$PID_RC" -eq 0
      - name: Upload emulator screenshot and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marrow-install-test-api-${{ matrix.api-level }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            marrow-launch-api-${{ matrix.api-level }}.png
            launch.txt
            pid.txt
            activity.txt
            logcat.txt
            package.txt
            install-summary.txt
          if-no-files-found: ignore
