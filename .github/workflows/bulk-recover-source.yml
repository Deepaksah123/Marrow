name: Bulk recover decompiler source

on:
  push:
    paths:
      - ".github/workflows/bulk-recover-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Marrow
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download the three exact archive parts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/marrow-recovery
          curl -fL --retry 5 --retry-all-errors -o /tmp/marrow-recovery/part01 \
            https://raw.githubusercontent.com/Deepaksah123/prepleadr-xi/main/base.apk_Decompiler.com.part01
          curl -fL --retry 5 --retry-all-errors -o /tmp/marrow-recovery/part02 \
            https://raw.githubusercontent.com/Deepaksah123/prepleadr-xi/main/base.apk_Decompiler.com.part02
          curl -fL --retry 5 --retry-all-errors -o /tmp/marrow-recovery/part03 \
            https://raw.githubusercontent.com/Deepaksah123/prepleadr-xi/main/base.apk_Decompiler.com.part03
          test "$(stat -c%s /tmp/marrow-recovery/part01)" = "25165824"
          test "$(stat -c%s /tmp/marrow-recovery/part02)" = "25165824"
          test "$(stat -c%s /tmp/marrow-recovery/part03)" = "21700155"

      - name: Reconstruct and validate the exact ZIP
        shell: bash
        run: |
          set -euo pipefail
          cat /tmp/marrow-recovery/part01 \
              /tmp/marrow-recovery/part02 \
              /tmp/marrow-recovery/part03 > /tmp/marrow-recovery/base.apk_Decompiler.com.zip
          test "$(stat -c%s /tmp/marrow-recovery/base.apk_Decompiler.com.zip)" = "72031803"
          unzip -t /tmp/marrow-recovery/base.apk_Decompiler.com.zip

      - name: Extract into the recovery source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf recovery/base_apk_Decompiler.com
          mkdir -p recovery/base_apk_Decompiler.com
          unzip -q /tmp/marrow-recovery/base.apk_Decompiler.com.zip -d recovery/base_apk_Decompiler.com
          test "$(find recovery/base_apk_Decompiler.com -type f | wc -l)" -gt 20000

      - name: Commit recovered source in automated batches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.version HTTP/1.1
          git config http.postBuffer 524288000

          cd recovery/base_apk_Decompiler.com
          find . -type f -print0 | sort -z > /tmp/recovery-files
          total=$(tr -cd '\0' < /tmp/recovery-files | wc -c)
          test "$total" -gt 20000
          echo "Recovered files: $total"

          batch=0
          count=0
          : > /tmp/current-batch
          while IFS= read -r -d '' file; do
            printf '%s\0' "${file#./}" >> /tmp/current-batch
            count=$((count + 1))
            if [ "$count" -ge 3000 ]; then
              batch=$((batch + 1))
              echo "Preparing batch $batch ($count files)"
              git -C ../.. add --pathspec-from-file=/tmp/current-batch --pathspec-file-nul
              git -C ../.. diff --cached --quiet && { : > /tmp/current-batch; count=0; continue; }
              git -C ../.. commit -m "Bulk import recovered source batch $batch"
              git -C ../.. push origin HEAD:main
              : > /tmp/current-batch
              count=0
            fi
          done < /tmp/recovery-files

          if [ "$count" -gt 0 ]; then
            batch=$((batch + 1))
            echo "Preparing final batch $batch ($count files)"
            git -C ../.. add --pathspec-from-file=/tmp/current-batch --pathspec-file-nul
            git -C ../.. diff --cached --quiet || git -C ../.. commit -m "Bulk import recovered source batch $batch"
            git -C ../.. push origin HEAD:main
          fi
