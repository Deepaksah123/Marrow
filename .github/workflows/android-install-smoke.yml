name: Android Install Smoke Test

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Sync Marrow content source
        run: bash scripts/sync_marrow_source.sh

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Static APK diagnostics
        run: |
          set -eu
          APK="$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          cp "$APK" /tmp/marrow-debug.apk
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt2" dump badging "$APK" > /tmp/aapt-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > /tmp/apksigner.txt
          unzip -t "$APK" > /tmp/zip-test.txt

      - name: Start Android emulator and exact adb install -r
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            adb start-server || true
            sleep 2
            cat > /tmp/run-install-test.sh <<'SH'
            set -u
            APK=/tmp/marrow-debug.apk
            PKG=com.deepaksah.marrow.rebuild
            test -f "$APK"
            adb start-server || true
            sleep 2
            adb wait-for-device
            adb devices -l > /tmp/adb-devices.txt
            adb shell getprop > /tmp/device-props.txt
            adb shell pm path "$PKG" > /tmp/pm-path-before.txt 2>&1 || true
            adb logcat -c
            set +e
            adb install -r "$APK" > /tmp/install.txt 2>&1
            RC=$?
            set -u
            printf '\nINSTALL_COMMAND=adb install -r %s\nINSTALL_RC=%s\n' "$APK" "$RC" >> /tmp/install.txt
            echo "===== EXACT adb install -r OUTPUT ====="
            cat /tmp/install.txt
            echo "===== EXACT adb install RC: $RC ====="
            adb shell pm path "$PKG" > /tmp/pm-path-after.txt 2>&1 || true
            adb shell dumpsys package "$PKG" > /tmp/package-dump.txt 2>&1 || true
            adb shell pm list packages -f | grep "$PKG" > /tmp/package-list.txt 2>&1 || true
            if [ "$RC" -eq 0 ]; then
              adb shell am force-stop "$PKG" || true
              adb shell monkey -p "$PKG" 1 > /tmp/launch.txt 2>&1 || true
              sleep 8
              adb shell dumpsys activity activities > /tmp/activities.txt 2>&1 || true
              adb shell dumpsys meminfo "$PKG" > /tmp/meminfo.txt 2>&1 || true
              adb exec-out screencap -p > /tmp/screen.png || true
            fi
            adb logcat -d > /tmp/logcat.txt || true
            echo "===== FINAL PACKAGE PATH ====="
            cat /tmp/pm-path-after.txt || true
            echo "===== FINAL PACKAGE LIST ====="
            cat /tmp/package-list.txt || true
            echo "===== INSTALL DIAGNOSTIC SCRIPT COMPLETE ====="
            exit 0
            SH
            sh /tmp/run-install-test.sh

      - name: Smoke-test marker
        run: echo "install-smoke-production-package"

      - name: Upload install diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marrow-install-diagnostics
          path: |
            /tmp/*.txt
            /tmp/*.png
          if-no-files-found: ignore
