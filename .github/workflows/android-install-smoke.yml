name: Android Install Smoke Test

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Sync Marrow content source
        run: bash scripts/sync_marrow_source.sh

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Static APK diagnostics
        run: |
          set -eu
          APK="$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/marrow-debug.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt2" dump badging "$APK" > /tmp/aapt-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > /tmp/apksigner.txt
          unzip -t "$APK" > /tmp/zip-test.txt

      - name: Start Android emulator and exact adb install -r
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          force-avd-creation: true
          emulator-options: -no-snapshot -wipe-data -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set -e
            sleep 10
            adb devices || true
            adb shell getprop sys.boot_completed || true
            adb devices
            if ! adb install -r app/build/outputs/apk/debug/app-debug.apk; then
              adb install --no-streaming -r app/build/outputs/apk/debug/app-debug.apk
            fi
            adb shell pm path com.deepaksah.marrow.rebuild
            adb shell am start -n com.deepaksah.marrow.rebuild/.MainActivity

            # The Pixel 7 emulator can surface a host-launcher ANR over the app.
            # Dismiss that system blocker before every UI assertion/capture.
            clear_launcher_anr() {
              adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
              if adb shell cat /sdcard/window.xml 2>/dev/null | grep -q "Pixel Launcher isn't responding"; then
                adb shell input tap 270 955 || true
                sleep 2
                adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
              fi
            }

            # Allow the real APK content-import/render path to settle before QA.
            # The previous fixed 45s capture was proven to catch the splash screen.
            sleep 90
            adb shell pidof com.deepaksah.marrow.rebuild || true

            # Wait for the actual Home UI instead of relying on a fixed sleep.
            READY=0
            for i in $(seq 1 180); do
              clear_launcher_anr
              adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
              if adb shell cat /sdcard/window.xml 2>/dev/null | grep -q 'navHome'; then
                READY=1
                break
              fi
              sleep 1
            done
            if [ "$READY" -ne 1 ]; then
              echo "Timed out waiting for Home UI"
              adb shell cat /sdcard/window.xml 2>/dev/null || true
              exit 1
            fi
            clear_launcher_anr
            adb exec-out screencap -p > /tmp/marrow-home.png

            # 1080px emulator: four equal-width bottom-nav items.
            # Tap the center of each actual tab, not the gaps between tabs.
            adb shell input tap 135 2300
            sleep 3
            clear_launcher_anr
            adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
            adb shell cat /sdcard/window.xml 2>/dev/null | grep -q 'qbankTracker' || exit 1
            clear_launcher_anr
            adb exec-out screencap -p > /tmp/marrow-qbank.png

            adb shell input tap 405 2300
            sleep 3
            clear_launcher_anr
            adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
            adb shell cat /sdcard/window.xml 2>/dev/null | grep -q 'testStart' || exit 1
            clear_launcher_anr
            adb exec-out screencap -p > /tmp/marrow-test.png

            adb shell input tap 675 2300
            sleep 3
            clear_launcher_anr
            adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
            adb shell cat /sdcard/window.xml 2>/dev/null | grep -q 'videoSubjects' || exit 1
            clear_launcher_anr
            adb exec-out screencap -p > /tmp/marrow-video.png

      - name: Smoke-test marker
        run: echo "install-smoke-production-package"

      - name: Upload install diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marrow-install-diagnostics
          path: |
            /tmp/*.txt
            /tmp/*.png
          if-no-files-found: ignore
