name: Android Install Smoke Test

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Sync Marrow content source
        run: bash scripts/sync_marrow_source.sh

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Static APK diagnostics
        run: |
          set -eu
          APK="$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/marrow-debug.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt2" dump badging "$APK" > /tmp/aapt-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > /tmp/apksigner.txt
          unzip -t "$APK" > /tmp/zip-test.txt

      - name: Direct Android emulator smoke test
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          AVDMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name avdmanager | head -1)"
          ADB="$ANDROID_HOME/platform-tools/adb"
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platform-tools" "emulator" "platforms;android-35" "system-images;android-35;google_apis;x86_64" >/dev/null
          test -x "$ADB"
          test -x "$EMULATOR"

          echo no | "$AVDMANAGER" create avd --force -n marrow-smoke --package "system-images;android-35;google_apis;x86_64" --device "pixel_7"
          nohup "$EMULATOR" -avd marrow-smoke -port 5554 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none >/tmp/emulator.log 2>&1 &
          EMU_PID=$!
          trap 'kill "$EMU_PID" >/dev/null 2>&1 || true' EXIT
          "$ADB" start-server >/dev/null 2>&1 || true
          for i in $(seq 1 120); do
            STATE="$("$ADB" get-state 2>/dev/null || true)"
            BOOT="$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            echo "attempt=$i state=$STATE boot=$BOOT"
            if [ "$STATE" = "device" ] && [ "$BOOT" = "1" ]; then break; fi
            "$ADB" reconnect offline >/dev/null 2>&1 || true
            sleep 2
          done
          test "$("$ADB" get-state)" = "device"
          test "$("$ADB" shell getprop sys.boot_completed | tr -d '\r')" = "1"
          "$ADB" install -r app/build/outputs/apk/debug/app-debug.apk
          "$ADB" shell pm path com.deepaksah.marrow.rebuild
          "$ADB" shell am start -W -n com.deepaksah.marrow.rebuild/.MainActivity
          sleep 5
          "$ADB" shell pidof com.deepaksah.marrow.rebuild
      - name: Smoke-test marker
        run: echo "install-smoke-production-package"

      - name: Upload install diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marrow-install-diagnostics
          path: |
            /tmp/*.txt
            /tmp/*.png
          if-no-files-found: ignore
