name: Android Install Smoke Test

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Sync Marrow content source
        run: bash scripts/sync_marrow_source.sh

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Start Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: |
            set -euxo pipefail
            adb wait-for-device
            adb shell getprop ro.build.version.sdk
            adb shell getprop ro.product.cpu.abilist
            adb install -r app/build/outputs/apk/debug/app-debug.apk 2>&1 | tee /tmp/install.txt
            adb shell pm path com.deepaksah.marrow.rebuild
            adb shell monkey -p com.deepaksah.marrow.rebuild 1
            adb shell dumpsys package com.deepaksah.marrow.rebuild | head -120
      - name: Upload install diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marrow-install-diagnostics
          path: /tmp/install.txt
          if-no-files-found: ignore
