name: Android Install Smoke Test

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Sync Marrow content source
        run: bash scripts/sync_marrow_source.sh

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Static APK diagnostics
        run: |
          set -eu
          APK="$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/marrow-debug.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt2" dump badging "$APK" > /tmp/aapt-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > /tmp/apksigner.txt
          unzip -t "$APK" > /tmp/zip-test.txt

      - name: Start Android emulator and exact adb install -r
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set -e
            APK="$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk"
            test -f "$APK"
            echo "===== ADB DEVICES ====="
            adb devices -l
            for i in $(seq 1 90); do
              STATE="$(adb get-state 2>/dev/null || true)"
              BOOT="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              echo "attempt=$i state=$STATE boot=$BOOT"
              if [ "$STATE" = "device" ] && [ "$BOOT" = "1" ]; then
                break
              fi
              sleep 2
            done
            test "$(adb get-state)" = "device"
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
            adb install -r "$APK"
            adb shell pm path com.deepaksah.marrow.rebuild
            adb shell am start -W -n com.deepaksah.marrow.rebuild/.MainActivity
            sleep 5
            adb shell pidof com.deepaksah.marrow.rebuild

      - name: Smoke-test marker
        run: echo "install-smoke-production-package"

      - name: Upload install diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marrow-install-diagnostics
          path: |
            /tmp/*.txt
            /tmp/*.png
          if-no-files-found: ignore
