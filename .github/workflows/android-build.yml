name: Android Build
# APK build trigger

on:
  push:
    branches: ["main", "rebuild/final-surfaces-batch"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Sync Marrow content source
        run: bash scripts/sync_marrow_source.sh
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Zipalign and re-sign debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          ALIGNED="app/build/outputs/apk/debug/app-debug-aligned.apk"
          SIGNED="app/build/outputs/apk/debug/app-debug-signed.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"
          test -f "$APK"

          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v               -keystore "$HOME/.android/debug.keystore"               -storepass android               -keypass android               -alias androiddebugkey               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -f "$HOME/.android/debug.keystore"

          "$ZIPALIGN" -p -f 4 "$APK" "$ALIGNED"
          "$ZIPALIGN" -c -v 4 "$ALIGNED"

          "$APKSIGNER" sign             --ks "$HOME/.android/debug.keystore"             --ks-pass pass:android             --key-pass pass:android             --v1-signing-enabled true             --v2-signing-enabled true             --out "$SIGNED"             "$ALIGNED"

          "$APKSIGNER" verify --verbose --print-certs "$SIGNED"
          mv "$SIGNED" "$APK"
          rm -f "$ALIGNED"
          "$ZIPALIGN" -c -v 4 "$APK"
          "$APKSIGNER" verify --verbose "$APK"
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: marrow-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
