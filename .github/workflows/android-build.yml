name: Android Build
# APK build trigger

on:
  push:
    branches: ["main", "rebuild/final-surfaces-batch"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Sync Marrow content source
        run: bash scripts/sync_marrow_source.sh
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Validate debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT2="$BUILD_TOOLS/aapt2"
          test -f "$APK"
          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"
          "$ZIPALIGN" -c -v 4 "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT2" dump badging "$APK" | tee app/build/outputs/apk/debug/apk-badging.txt
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: marrow-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload APK validation report
        uses: actions/upload-artifact@v4
        with:
          name: marrow-apk-validation
          path: app/build/outputs/apk/debug/apk-badging.txt
          if-no-files-found: error
