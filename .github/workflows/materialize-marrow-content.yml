name: Materialize Marrow Content

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-local-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify repository-local Edition 8 content
        shell: bash
        run: |
          set -euo pipefail
          ROOT="app/src/main/assets/marrow_content/Brain/Marrow/Edition 8 qBank"
          test -d "$ROOT"
          expected=$(cat <<\EOF
Anaesthesia
Anatomy
Biochemistry
Community Medicine
Dermatology
ENT
Forensic Medicine
Medicine
Microbiology
Obstetrics & Gynaecology
Ophthalmology
Orthopaedics
Paediatrics
Pathology
Pharmacology
Physiology
Psychiatry
Radiology
Surgery
EOF
          )
          while IFS= read -r subject; do
            test -d "$ROOT/$subject"
          done <<< "$expected"
          if find app/src/main/assets/marrow_content/Brain/Marrow -maxdepth 1 -iname '*marrow6*' -o -iname '*edition 6*' | grep -q .; then
            echo "Forbidden Marrow6/Edition6 content detected."
            exit 1
          fi
          echo "Repository-local Marrow Edition 8 content verified. No external source sync is performed."
