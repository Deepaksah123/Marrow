name: Materialize Marrow Content

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Sync Marrow content into app folder
        run: bash scripts/sync_marrow_source.sh
      - name: Commit Marrow content folder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/marrow_content
          if git diff --cached --quiet; then
            echo "No Marrow content changes."
            exit 0
          fi
          git commit -m "Materialize Marrow content in app folder [skip ci]"
          git push
